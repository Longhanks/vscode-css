    <script>
        (function () {
            const orig = Element.prototype.attachShadow;

            Element.prototype.attachShadow = function (init) {
            const shadowRoot = orig.call(this, init);

            const style = document.createElement("style");
            style.textContent = `
                /* Menus: Remove "Add File to Chat" */
                ul.actions-container li:has(span.action-label[aria-label="Add File to Chat"]) {
                    display: none !important;

                ul.actions-container li:has(span.action-label[aria-label="Review"]) {
                    display: none !important;
                }

                /* Menus: Remove separator after "Review" */
                ul.actions-container li:has(span.action-label[aria-label="Review"]) + li {
                    display: none !important;
                }

                /* Menus: Remove "Add Selection to Chat" */
                ul.actions-container li:has(span.action-label[aria-label="Add Selection to Chat"]) {
                    display: none !important;
                }

                /* Menus: Remove "Share" */
                ul.actions-container li:has(span.action-label[aria-label="Share"]) {
                    display: none !important;
                }

                /* Menus: Remove separator after "Share" */
                ul.actions-container li:has(span.action-label[aria-label="Share"]) + li {
                    display: none !important;
                }

                /* Menus: Restore theme color support */
                .monaco-menu .monaco-action-bar.vertical .action-item.focused > .action-menu-item {
                    background-color: var(--vscode-menu-selectionBackground) !important;
                    color: var(--vscode-menu-selectionForeground) !important;
                    outline: var(--vscode-menu-selectionBorder) !important;
                    outline-offset: -1px !important;
                }

                /* Menus: Un-round hover background color edges */
                .monaco-menu .monaco-action-bar.vertical .action-menu-item {
                    border-radius: 4px !important;
                    height: 2em !important;
                }
            `;
            shadowRoot.appendChild(style);

            return shadowRoot;
        };
        })();
    </script>
